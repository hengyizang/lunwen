[project]
name = "doctoral-research-os"
version = "2.2.0"
description = "API-first, human-gated Doctoral Research OS for topic selection, experiments, writing, review, venues and manual submission"
requires-python = ">=3.10"

[project.optional-dependencies]
figures = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3"
]

[tool.unittest]
start-directory = "tests"
