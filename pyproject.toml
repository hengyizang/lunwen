[project]
name = "doctoral-research-os"
version = "2.2.0"
description = "API-first, human-gated Doctoral Research OS for topic selection, experiments, writing, review, venues and manual submission"
requires-python = ">=3.10"

[project.optional-dependencies]
figures = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3"
]
reference-tools = [
  "ref-verify==1.2.0"
]
reader = [
  "pypdf>=5,<7",
  "python-pptx>=1.0,<2"
]

# This repository is an application/control-plane tree, not an importable
# Python distribution.  Declaring an empty package set lets pip resolve the
# optional dependency groups without setuptools guessing from top-level data
# directories such as config/, skills/, and schemas/.
[tool.setuptools]
packages = []

[tool.unittest]
start-directory = "tests"
