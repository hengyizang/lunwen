name: Source-bound writing comparison 20261027
on:
  push:
    branches: [codex/writing-comparison-20261027]
    paths:
      - scripts/writing_comparison.py
      - config/writing-comparison-20261027.json
      - .github/workflows/writing-comparison-20261027.yml
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [metadata, execute]
        default: metadata
permissions:
  contents: read
concurrency:
  group: owner-research-cloud-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify billing, authorization, source and replay controls without credentials
        run: |
          python -m unittest tests.test_writing_comparison tests.test_relay_guard tests.test_production_providers tests.test_dynamic_providers -v
          python -m py_compile scripts/writing_comparison.py scripts/relay_guard.py
          git diff --check
  comparison:
    needs: validation
    if: github.repository == 'hengyizang/lunwen'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run only the owner-authorized finite cloud trial
        env:
          GH_TOKEN: ${{ github.token }}
          # The finite trial is closed. Pushes return to read-only metadata;
          # explicit execute also cannot replay any closed or attempted ID.
          WRITING_COMPARISON_MODE: ${{ inputs.mode || 'metadata' }}
          WRITING_COMPARISON_AUTHORIZATION: writing-comparison-20261027-owner-paid-with-legacy-holds
          DR_OS_CHEAPAI_GPT_PRO_KEY: ${{ secrets.DR_OS_CHEAPAI_GPT_PRO_KEY }}
          DR_OS_CODEKEY_GEMINI_KEY: ${{ secrets.DR_OS_CODEKEY_GEMINI_KEY }}
        run: python -m scripts.writing_comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: writing-comparison-${{ github.run_id }}
          path: |
            .runtime/writing-comparison/
            .runtime/writing-review/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
