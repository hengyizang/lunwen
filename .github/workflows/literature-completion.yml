name: Literature completion acceptance
on:
  pull_request:
    paths:
      - 'scripts/literature*'
      - 'scripts/evidence_retrieval.py'
      - 'tests/test_literature*'
      - 'integrations/literature-semantic.lock.json'
      - '.github/workflows/literature-completion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: literature-completion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DR_OS_CLOUD_EXECUTOR: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU and PDF runtime without provider credentials
        run: |
          python -m pip install --disable-pip-version-check '.[reader,figure-retrieval]' 'paper-qa==2026.08.12' 'Pillow>=10,<13' 'reportlab>=4,<5'
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::https::Timeout=20 poppler-utils tesseract-ocr fonts-dejavu-core
      - name: Validate new cloud library mechanisms
        run: >-
          python -m unittest tests.test_literature_semantic tests.test_literature_pdf
          tests.test_literature_comparison tests.test_literature_zotero
          tests.test_literature_paperqa tests.test_literature_completion_routes -v
      - name: Exercise real open paper with actual CPU ranking and PDF overlays
        run: python -m scripts.literature_completion_acceptance --directory artifacts/literature-completion
      - name: Verify repository contracts
        run: |
          python -m compileall -q scripts tests
          python scripts/validate_repo.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: literature-completion
          path: artifacts/literature-completion
          if-no-files-found: warn
