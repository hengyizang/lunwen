name: Native TeX source-package acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: completeness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install core source-package validation dependencies
        timeout-minutes: 7
        run: python -m pip install --disable-pip-version-check .
      - name: Install TeX for the independent submission ZIP compilation
        timeout-minutes: 7
        run: |
          sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 texlive-latex-base
      - name: Compile the exact submission ZIP in an independent native TeX environment
        run: python -m unittest tests.test_tex_sources -v
