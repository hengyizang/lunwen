name: Owner research cloud job

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: owner-research-cloud-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.repository == 'hengyizang/lunwen' &&
      github.event.issue.user.id == github.event.repository.owner.id &&
      startsWith(github.event.issue.title, '[research-cloud]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate the owner issue as a single structured job
        id: job
        run: >-
          python -m scripts.cloud_job validate-event
          --event "$GITHUB_EVENT_PATH"
          --output .runtime/cloud-job.json
          --github-output "$GITHUB_OUTPUT"
      - name: Install pinned research adapters for public acceptance
        if: steps.job.outputs.action == 'acceptance' || steps.job.outputs.action == 'tooluniverse'
        run: python -m pip install --disable-pip-version-check '.[ai4science,reference-tools]'
      - name: Install source reading for bounded native question answering
        if: contains(fromJSON('["paperqa","literature","cycle","continuation"]'), steps.job.outputs.action)
        run: |
          python -m pip install --disable-pip-version-check '.[reader]' 'Pillow>=10,<13'
          if ! command -v pdftoppm >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y poppler-utils; fi
      - name: Install the reviewed project literature skills
        env:
          DR_OS_CLOUD_EXECUTOR: '1'
        run: python -m scripts.literaturectl install
      - name: Install the complete pinned CCFA project skill family
        env:
          DR_OS_CLOUD_EXECUTOR: '1'
        run: python -m scripts.ccfa_runtime install
      - name: Install declared validation tools for human review controls
        if: contains(fromJSON('["review_dossier","ready","approve","advance","reopen","freeze_preregistration","confirm_data_quality","confirm_reproduction","screen_literature","confirm_source_scope","confirm_review_packet","confirm_research_increment","start_revision","confirm_study_validation","approve_supplemental","confirm_supplemental","retire_supplemental","approve_primary_retry","retire_primary_plan","approve_scope_amendment","reconcile_relay_guard"]'), steps.job.outputs.action)
        run: python -m pip install --disable-pip-version-check '.[figures,reader,research-quality,reference-tools]'
      - name: Install owner-enabled offline statistical watermark runtime on CPU
        if: vars.DR_OS_ENABLE_WATERMARK_DETECTOR == 'true' && contains(fromJSON('["cycle","continuation","review_dossier","ready","approve","advance","start_revision","confirm_study_validation","approve_supplemental","confirm_supplemental","retire_supplemental","approve_primary_retry","retire_primary_plan","approve_scope_amendment","reconcile_relay_guard"]'), steps.job.outputs.action)
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.57.1 tokenizers==0.22.1
      - name: Run requested cloud job
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          DR_OS_ROUTING_PROFILE: production
          DR_OS_DYNAMIC_ROUTING: ${{ vars.DR_OS_DYNAMIC_ROUTING || 'production' }}
          DR_OS_CHEAPAI_KIRO_DISCOUNT_KEY: ${{ secrets.DR_OS_CHEAPAI_KIRO_DISCOUNT_KEY }}
          DR_OS_CHEAPAI_CCMAX_KEY: ${{ secrets.DR_OS_CHEAPAI_CCMAX_KEY }}
          DR_OS_CODEKEY_CODEX_PRO_KEY: ${{ secrets.DR_OS_CODEKEY_CODEX_PRO_KEY }}
          DR_OS_CODEKEY_CODEX_DISCOUNT_KEY: ${{ secrets.DR_OS_CODEKEY_CODEX_DISCOUNT_KEY }}
          DR_OS_CODEKEY_KIRO_STANDARD_KEY: ${{ secrets.DR_OS_CODEKEY_KIRO_STANDARD_KEY }}
          DR_OS_AUTOMATIC_RESEARCH_ENABLED: ${{ vars.DR_OS_AUTOMATIC_RESEARCH_ENABLED }}
          DR_OS_CHEAPAI_GPT_PRO_KEY: ${{ secrets.DR_OS_CHEAPAI_GPT_PRO_KEY }}
          DR_OS_CHEAPAI_GPT_DISCOUNT_KEY: ${{ secrets.DR_OS_CHEAPAI_GPT_DISCOUNT_KEY }}
          DR_OS_CODEKEY_KIRO_ENTERPRISE_KEY: ${{ secrets.DR_OS_CODEKEY_KIRO_ENTERPRISE_KEY }}
          DR_OS_CODEKEY_DEEPSEEK_KEY: ${{ secrets.DR_OS_CODEKEY_DEEPSEEK_KEY }}
          DR_OS_CODEKEY_GEMINI_KEY: ${{ secrets.DR_OS_CODEKEY_GEMINI_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          DR_OS_TEX_IMAGE: ${{ vars.DR_OS_TEX_IMAGE }}
          DR_OS_WATERMARK_KEY_ACTIVE: ${{ secrets.DR_OS_WATERMARK_KEY_ACTIVE }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DR_OS_TAVILY_CREDIT_CNY: ${{ vars.DR_OS_TAVILY_CREDIT_CNY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOCHA_JEV_API_KEY: ${{ secrets.BOCHA_JEV_API_KEY }}
          BOCHA_JEV_FREE_POLICY_CHECKED_ON: ${{ vars.BOCHA_JEV_FREE_POLICY_CHECKED_ON }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LITERATURE_CONTACT_EMAIL: ${{ secrets.LITERATURE_CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENCITATIONS_ACCESS_TOKEN: ${{ secrets.OPENCITATIONS_ACCESS_TOKEN }}
        run: >-
          python -m scripts.cloud_job execute
          --config .runtime/cloud-job.json
          --run-id "$GITHUB_RUN_ID"
      - name: Preserve hash-bound research checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-checkpoint-${{ github.run_id }}
          path: .runtime/checkpoint/checkpoint.zip
          if-no-files-found: ignore
          retention-days: 90
      - name: Return the outcome to the requesting issue
        if: always() && steps.job.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python -m scripts.cloud_job comment
          --issue "$ISSUE_NUMBER"
          --summary .runtime/cloud-summary.md
      - name: Preserve redacted receipts and tracked-result snapshot
        if: always() && steps.job.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: cloud-research-${{ github.run_id }}
          path: .runtime/cloud-artifact/
          if-no-files-found: warn
          retention-days: 14
      - name: Continue healthy owner-authorized work after its checkpoint
        if: steps.execute.outcome == 'success' && steps.job.outputs.action == 'continuation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.cloud_continuation enqueue-followup
          --decision .runtime/continuation-followup.json
      - name: Verify automatic repair permissions without model calls
        if: steps.execute.outcome == 'success' && steps.job.outputs.action == 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-recovery.yml --repo hengyizang/lunwen --ref main -f mode=probe

