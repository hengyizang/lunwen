name: Validate research workflow

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared figure and reader dependencies and PDF test fixture helper
        run: python -m pip install --disable-pip-version-check ".[figures,reader]" "reportlab>=4,<5"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python entry points
        run: python -m compileall -q scripts tests
      - name: Validate manifests and extensions
        run: python scripts/validate_repo.py
      - name: Reject whitespace errors
        run: git diff --check

  live-literature:
    name: Live public literature APIs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-acceptance]'))
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      OPENCITATIONS_ACCESS_TOKEN: ${{ secrets.OPENCITATIONS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise all public literature providers
        run: >-
          python scripts/live_acceptance.py literature
          --limit 1
          --output artifacts/acceptance/literature.json
      - name: Preserve API receipts and raw responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-literature-acceptance
          path: artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 14

  container-isolation:
    name: Docker isolation probe
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-acceptance]'))
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run digest-pinned no-network read-only container
        run: >-
          python scripts/live_acceptance.py container
          --engine docker
          --output artifacts/acceptance/container.json
      - name: Preserve container acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-isolation-acceptance
          path: artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 14
