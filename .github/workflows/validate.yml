name: Validate research workflow

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      install_ai4science:
        description: "Install and smoke-test PaperQA2, ToolUniverse and ref-verify"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-produce:
    name: Cloud executor and checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Execute synthetic negative and failed runs with the real Docker executor
        run: python -m scripts.cloud_pipeline_acceptance produce --directory artifacts/cloud-pipeline
      - name: Transfer exact checkpoint to an independent runner
        uses: actions/upload-artifact@v7
        with:
          name: cloud-pipeline-transfer
          path: artifacts/cloud-pipeline/transfer/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failed executor diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-pipeline-producer-failure
          path: artifacts/cloud-pipeline/
          if-no-files-found: warn
          retention-days: 14

  cloud-restore:
    name: Fresh runner restore and scientific exports
    needs: cloud-produce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: cloud-pipeline-transfer
          path: artifacts/cloud-pipeline/transfer/
      - name: Restore hashes and test the actual figure, DOCX and isolated TeX toolchain
        run: python -m scripts.cloud_pipeline_acceptance consume --directory artifacts/cloud-pipeline
      - name: Preserve acceptance evidence and export fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-pipeline-acceptance
          path: artifacts/cloud-pipeline/
          if-no-files-found: error
          retention-days: 14

  cloud-human-controls:
    name: Cloud human review controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned statistics runtime without model credentials
        run: python -m pip install --disable-pip-version-check '.[research-quality]'
      - name: Exercise actual human control functions on synthetic evidence
        run: python -m scripts.cloud_human_acceptance --directory artifacts/cloud-human-controls
      - name: Preserve scoped human-control acceptance receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-human-controls-acceptance
          path: artifacts/cloud-human-controls/
          if-no-files-found: error
          retention-days: 14

  experiment-evidence:
    name: Experiment design and statistical evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned statistical runtime without model credentials
        run: python -m pip install --disable-pip-version-check '.[research-quality]'
      - name: Execute synthetic paired studies and failed pilot with the real Docker executor
        run: python -m scripts.experiment_evidence_acceptance --directory artifacts/experiment-evidence
      - name: Preserve scoped statistical software evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experiment-evidence-acceptance
          path: artifacts/experiment-evidence/
          if-no-files-found: error
          retention-days: 14

  gateway-startup:
    name: Gateway startup and five-role cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise production routing and durable budgets with synthetic HTTP
        run: python -m scripts.gateway_acceptance --directory artifacts/gateway-startup
      - name: Preserve gateway software acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-startup-acceptance
          path: artifacts/gateway-startup/
          if-no-files-found: error
          retention-days: 14

  deterministic:
    name: Deterministic checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared figure and reader dependencies and PDF test fixture helper
        run: python -m pip install --disable-pip-version-check ".[figures,reader,research-quality]" "reportlab>=4,<5"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python entry points
        run: python -m compileall -q scripts tests
      - name: Validate manifests and extensions
        run: python scripts/validate_repo.py
      - name: Reject whitespace errors
        run: git diff --check

  windows-script-syntax:
    name: Windows D-drive installer syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell without running installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\install-d-drive.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  live-literature:
    name: Live public literature APIs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-acceptance]'))
    needs: [deterministic, windows-script-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      OPENCITATIONS_ACCESS_TOKEN: ${{ secrets.OPENCITATIONS_ACCESS_TOKEN }}
      LITERATURE_CONTACT_EMAIL: ${{ secrets.LITERATURE_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise credential-free providers and configured keyed providers
        run: >-
          python scripts/live_acceptance.py literature
          --limit 1
          --allow-missing-semantic-scholar-key
          --allow-missing-serpapi-key
          --output artifacts/acceptance/literature.json
      - name: Preserve API receipts and raw responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-literature-acceptance
          path: artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 14

  adapter-packages:
    name: Install executable research adapters
    if: github.event_name == 'workflow_dispatch' && inputs.install_ai4science
    needs: [deterministic, windows-script-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned executable adapters
        run: python -m pip install --disable-pip-version-check ".[ai4science,reference-tools]"
      - name: Verify package identity and executable entry points
        run: |
          python -c "import importlib.metadata as m; from packaging.version import Version; assert Version(m.version('paper-qa')) == Version('2026.08.12'); assert Version(m.version('tooluniverse')) == Version('1.5.1'); assert Version(m.version('ref-verify')) == Version('1.2.0')"
          pqa --help >/dev/null
          ref-verify --help >/dev/null
          python -c "from tooluniverse import ToolUniverse; assert ToolUniverse"
      - name: Run adapter contract tests against installed packages
        run: python -m unittest tests.test_ai4science_evidence tests.test_tooluniverse_worker tests.test_ref_verify_adapter -v

  container-isolation:
    name: Docker isolation probe
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-acceptance]'))
    needs: [deterministic, windows-script-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run digest-pinned no-network read-only container
        run: >-
          python scripts/live_acceptance.py container
          --engine docker
          --output artifacts/acceptance/container.json
      - name: Preserve container acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-isolation-acceptance
          path: artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 14
