name: Validate research workflow

on:
  workflow_call:
    inputs:
      repair_ref:
        type: string
        default: ''
      offline_only:
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      install_ai4science:
        description: "Install and smoke-test PaperQA2, ToolUniverse and ref-verify"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected execution acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      experiment_evidence: ${{ steps.paths.outputs.experiment_evidence }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Detect experiment and evidence changes
        env:
          DR_OS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DR_OS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import fnmatch, os, subprocess
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', os.environ['DR_OS_BASE_SHA'], os.environ['DR_OS_HEAD_SHA'],
          ], text=True).splitlines()
          patterns = (
              '.github/workflows/validate.yml', '.github/actions/setup-runtime/*',
              'scripts/experiment*.py', 'scripts/container*.py', 'scripts/results_validation.py',
              'scripts/research_quality.py', 'scripts/source_scope.py', 'scripts/result_values.py',
              'scripts/scientific_numbers.py', 'scripts/operating_constraints.py',
              'scripts/output_provenance.py', 'scripts/research_artifacts.py',
              'scripts/empirical*.py', 'scripts/statistical_reporting.py', 'scripts/study_routes.py',
              'scripts/baseline*.py', 'scripts/clean_room*.py', 'scripts/researchctl.py',
              'schemas/*experiment*', 'schemas/*reproduction*', 'config/*experiment*',
              'tests/test_experiment*.py', 'tests/test_container*.py', 'tests/test_execution_protocols.py',
              'tests/test_results_validation.py', 'tests/test_scientific_result_bindings.py',
              'tests/test_empirical*.py', 'tests/test_research_quality.py', 'docker/*',
          )
          affected = any(fnmatch.fnmatch(path, pattern) for path in paths for pattern in patterns)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('experiment_evidence=' + str(affected).lower(), file=output)
          PYTHON

  fast-tests:
    name: Fast deterministic feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
          packages: '[".[figures,reader,research-quality]", "reportlab>=4,<5"]'
      - name: Run the measured fast partition
        run: python scripts/run_tests.py fast

  study-routes:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Meta analysis and formal theory on cloud CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
          packages: '[".[research-quality]"]'
      - name: Run actual isolated Meta calculations and Lean kernel checks
        env:
          DR_OS_CLOUD_EXECUTOR: "1"
        run: python -m scripts.study_route_acceptance --directory artifacts/study-routes
      - name: Preserve scoped acceptance and executor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: study-routes-acceptance
          path: artifacts/study-routes/
          if-no-files-found: warn
          retention-days: 14

  statistical-watermark-cpu:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Configured statistical watermark detector on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
      - name: Install pinned CPU detector without provider credentials or model weights
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.57.1 tokenizers==0.22.1
      - name: Detect actual known marked and unmarked offline fixtures
        env:
          DR_OS_TEST_WATERMARK_RUNTIME: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: python -m unittest tests.test_statistical_watermarks -v

  cloud-produce:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Cloud executor and checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
      - name: Execute synthetic negative and failed runs with the real Docker executor
        run: python -m scripts.cloud_pipeline_acceptance produce --directory artifacts/cloud-pipeline
      - name: Transfer exact checkpoint to an independent runner
        uses: actions/upload-artifact@v7
        with:
          name: cloud-pipeline-transfer
          path: artifacts/cloud-pipeline/transfer/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failed executor diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-pipeline-producer-failure
          path: artifacts/cloud-pipeline/
          if-no-files-found: warn
          retention-days: 14

  cloud-restore:
    name: Fresh runner restore and scientific exports
    needs: cloud-produce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: cloud-pipeline-transfer
          path: artifacts/cloud-pipeline/transfer/
      - name: Restore hashes and test the actual figure, DOCX and isolated TeX toolchain
        run: python -m scripts.cloud_pipeline_acceptance consume --directory artifacts/cloud-pipeline
      - name: Preserve acceptance evidence and export fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-pipeline-acceptance
          path: artifacts/cloud-pipeline/
          if-no-files-found: error
          retention-days: 14

  cloud-human-controls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Cloud human review controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
          packages: '[".[research-quality]"]'
      - name: Exercise actual human control functions on synthetic evidence
        run: python -m scripts.cloud_human_acceptance --directory artifacts/cloud-human-controls
      - name: Preserve scoped human-control acceptance receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-human-controls-acceptance
          path: artifacts/cloud-human-controls/
          if-no-files-found: error
          retention-days: 14

  experiment-evidence:
    needs: changes
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.experiment_evidence == 'true')
    name: Experiment design and statistical evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
          packages: '[".[research-quality]"]'
      - name: Execute synthetic paired studies and failed pilot with the real Docker executor
        run: python -m scripts.experiment_evidence_acceptance --directory artifacts/experiment-evidence
      - name: Reproduce a complete Docker result table outside its original project
        env:
          DR_OS_TEST_REAL_DOCKER: '1'
          DR_OS_CONTAINER_REPRO_ARTIFACTS: artifacts/experiment-evidence/container-reproduction
        run: |
          python -c 'import jsonschema'
          python -m unittest tests.test_container_reproduction -v
      - name: Preserve scoped statistical software evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experiment-evidence-acceptance
          path: artifacts/experiment-evidence/
          if-no-files-found: error
          retention-days: 14

  gateway-startup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Gateway transport and recorded research calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
      - name: Exercise production routing and durable budgets with synthetic HTTP
        run: python -m scripts.gateway_acceptance --directory artifacts/gateway-startup
      - name: Verify lossless context, request reuse and fresh reviews without model credentials
        run: python -m scripts.cloud_recovery_acceptance --suite cost-quality --output artifacts/gateway-startup/cost-quality/acceptance.json
      - name: Preserve gateway software acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-startup-acceptance
          path: artifacts/gateway-startup/
          if-no-files-found: error
          retention-days: 14

  cloud-recovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Automatic recovery safety and fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          ccfa: 'true'
      - name: Inject engineering faults without paid calls or production state
        run: python -m scripts.cloud_recovery_acceptance --output artifacts/cloud-recovery/acceptance.json
      - name: Preserve scoped recovery acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-recovery-acceptance
          path: artifacts/cloud-recovery/
          if-no-files-found: error
          retention-days: 30

  deterministic:
    name: Deterministic checks (Python ${{ matrix.python-version }})
    needs: fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            suite: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.repair_ref != '') && 'all' || 'compat' }}
          - python-version: "3.12"
            suite: slow
          - python-version: "3.13"
            suite: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.repair_ref != '') && 'all' || 'compat' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "${{ matrix.python-version }}"
          ccfa: 'true'
          packages: '[".[figures,reader,research-quality]", "reportlab>=4,<5"]'
      - name: Remaining tests and cross-version compatibility
        run: python scripts/run_tests.py ${{ matrix.suite }}
      - name: Compile Python entry points
        run: python -m compileall -q scripts tests
      - name: Validate manifests and extensions
        run: python scripts/validate_repo.py
      - name: Reject whitespace errors
        run: git diff --check

  windows-script-syntax:
    name: Windows D-drive installer syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - name: Parse PowerShell without running installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\install-d-drive.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  live-literature:
    name: Live public literature APIs
    if: >-
      !inputs.offline_only && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-acceptance]')))
    needs: [deterministic, windows-script-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      OPENCITATIONS_ACCESS_TOKEN: ${{ secrets.OPENCITATIONS_ACCESS_TOKEN }}
      LITERATURE_CONTACT_EMAIL: ${{ secrets.LITERATURE_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
      - name: Exercise credential-free providers and configured keyed providers
        run: >-
          python scripts/live_acceptance.py literature
          --limit 1
          --allow-missing-semantic-scholar-key
          --allow-missing-serpapi-key
          --output artifacts/acceptance/literature.json
      - name: Preserve API receipts and raw responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-literature-acceptance
          path: artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 14

  adapter-packages:
    name: Install executable research adapters
    if: ${{ !inputs.offline_only && github.event_name == 'workflow_dispatch' && inputs.install_ai4science }}
    needs: [deterministic, windows-script-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
          packages: '[".[ai4science,reference-tools]"]'
      - name: Verify package identity and executable entry points
        run: |
          python -c "import importlib.metadata as m; from packaging.version import Version; assert Version(m.version('paper-qa')) == Version('2026.08.12'); assert Version(m.version('tooluniverse')) == Version('1.5.1'); assert Version(m.version('ref-verify')) == Version('1.2.0')"
          pqa --help >/dev/null
          ref-verify --help >/dev/null
          python -c "from tooluniverse import ToolUniverse; assert ToolUniverse"
      - name: Run adapter contract tests against installed packages
        run: python -m unittest tests.test_ai4science_evidence tests.test_tooluniverse_worker tests.test_ref_verify_adapter -v

  container-isolation:
    name: Docker isolation probe
    if: >-
      !inputs.offline_only && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-acceptance]')))
    needs: [deterministic, windows-script-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repair_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-runtime
        with:
          python-version: "3.12"
      - name: Run digest-pinned no-network read-only container
        run: >-
          python scripts/live_acceptance.py container
          --engine docker
          --output artifacts/acceptance/container.json
      - name: Preserve container acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-isolation-acceptance
          path: artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 14
