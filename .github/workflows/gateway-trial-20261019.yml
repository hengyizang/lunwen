name: Bounded relay acceptance CNY30

on:
  push:
    branches: [codex/relay-acceptance-20261019]

concurrency:
  group: relay-acceptance-20261019-budget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offline:
    name: Acceptance controls and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check '.[figures,reader,research-quality]' 'reportlab>=4,<5'
      - name: Test deterministic controls with fake credentials only
        run: python -m unittest discover -s tests -v
      - name: Compile and validate
        run: |
          python -m compileall -q scripts tests
          python scripts/validate_repo.py
          git diff --check
  live:
    name: Isolated cloud relay acceptance
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Accept one encrypted handoff and execute bounded trial
        env:
          TRIAL_GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.gateway_trial
