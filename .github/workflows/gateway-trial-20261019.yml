name: Bounded relay acceptance CNY30

on:
  push:
    branches: [codex/relay-acceptance-20261019]

concurrency:
  group: relay-acceptance-20261019-budget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offline:
    name: Acceptance controls and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check '.[figures,reader,research-quality]' 'reportlab>=4,<5'
      - name: Test deterministic controls with fake credentials only
        run: python -m unittest discover -s tests -v
      - name: Compile and validate
        run: |
          python -m compileall -q scripts tests
          python scripts/validate_repo.py
          git diff --check
  live:
    name: Isolated cloud relay acceptance
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Execute bounded trial using isolated Actions Secrets
        env:
          TRIAL_GITHUB_TOKEN: ${{ github.token }}
          TRIAL_RECONCILE_AND_CONTINUE: '1'
          TRIAL_RESUME_METADATA_SKIPS: '1'
          MODEL_TEST_CHEAPAI_GPT_PRO_KEY: ${{ secrets.MODEL_TEST_CHEAPAI_GPT_PRO_KEY }}
          MODEL_TEST_CHEAPAI_GPT_DISCOUNT_KEY: ${{ secrets.MODEL_TEST_CHEAPAI_GPT_DISCOUNT_KEY }}
          MODEL_TEST_CHEAPAI_KIRO_KEY: ${{ secrets.MODEL_TEST_CHEAPAI_KIRO_KEY }}
          MODEL_TEST_CHEAPAI_CCMAX_KEY: ${{ secrets.MODEL_TEST_CHEAPAI_CCMAX_KEY }}
          MODEL_TEST_CODEKEY_DEEPSEEK_KEY: ${{ secrets.MODEL_TEST_CODEKEY_DEEPSEEK_KEY }}
          MODEL_TEST_CODEKEY_GEMINI_KEY: ${{ secrets.MODEL_TEST_CODEKEY_GEMINI_KEY }}
          MODEL_TEST_CODEKEY_CODEX_PURE_KEY: ${{ secrets.MODEL_TEST_CODEKEY_CODEX_PURE_KEY }}
          MODEL_TEST_CODEKEY_KIRO_ENTERPRISE_KEY: ${{ secrets.MODEL_TEST_CODEKEY_KIRO_ENTERPRISE_KEY }}
          MODEL_TEST_CODEKEY_CODEX_DISCOUNT_KEY: ${{ secrets.MODEL_TEST_CODEKEY_CODEX_DISCOUNT_KEY }}
          MODEL_TEST_CODEKEY_KIRO_STANDARD_KEY: ${{ secrets.MODEL_TEST_CODEKEY_KIRO_STANDARD_KEY }}
        run: python -m scripts.gateway_trial
